<style>
:root{
  --bg:#EDF1EF; --card:#FAFBF9; --ink:#1F2D31; --ink2:#53656B; --line:#C5D3D1;
  --main:#3F6670; --main-soft:#D3E1E1; --seal:#C83A2E;
  --t-shisheng:#3F6670; --t-tongxue:#9A7B3C; --t-pengyou:#5B5E9C; --t-jiaren:#B5413A; --t-tongshi:#5E8A4F; --t-lianren:#8E4A73;
  --zh:"Noto Serif SC","Songti SC",serif; --vi:"Noto Serif",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--vi);-webkit-text-size-adjust:100%}
body{min-height:100svh;display:flex;flex-direction:column;
  background-image:radial-gradient(circle at 10% 0%,rgba(63,102,112,.12),transparent 42%),radial-gradient(circle at 100% 100%,rgba(63,102,112,.10),transparent 45%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* ---------- header ---------- */
header{position:relative;display:flex;align-items:center;gap:14px;padding:10px 20px 8px;flex-wrap:wrap;overflow:hidden;
  background:linear-gradient(180deg,#DCE7E6 0%,rgba(237,241,239,0) 100%);border-bottom:1px solid rgba(63,102,112,.12)}
header>*{position:relative}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:52px;height:52px;flex:none;display:block}
.brand-name{font-weight:700;font-size:15px;letter-spacing:.5px;color:var(--ink2)}
.brand-sub{font-size:12px;color:var(--ink2);opacity:.8}
.title{flex:1;min-width:220px;text-align:center}
.title h1{font-family:var(--zh);font-size:25px;font-weight:700;color:#2C4C55;letter-spacing:2px;text-shadow:0 0 10px #EDF1EF,0 0 4px #EDF1EF}
.title p{font-size:13.5px;font-weight:600;color:#33474D;text-shadow:0 0 8px #EDF1EF,0 0 3px #EDF1EF}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tbtn{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px}
.tbtn[aria-pressed="true"]{background:var(--main);border-color:var(--main);color:#fff}

/* level tabs */
.levels{display:flex;gap:6px;justify-content:center;padding:2px 16px 8px;flex-wrap:wrap}
.lv{padding:5px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.lv.on{background:var(--main);color:#fff;border-color:var(--main)}
.lv:disabled{opacity:.55;cursor:not-allowed;font-weight:400}
.lv small{font-weight:400;font-size:11px;opacity:.85}

/* ---------- stage ---------- */
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 16px}
.stage{position:relative;container-type:inline-size;width:100%}
.stage.L{aspect-ratio:16/9;width:min(100%, calc((100svh - 205px) * 16 / 9));min-width:min(100%,760px)}
.stage.P{aspect-ratio:100/270}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.zone{position:absolute;border:1.5px solid var(--line);border-radius:1.4cqw;background:rgba(250,251,249,.6)}
.zone h2{position:absolute;left:1.2cqw;top:.6cqw;font-family:var(--zh);font-weight:700;color:var(--ink2);font-size:1.25cqw;white-space:nowrap}

.seg.dot{stroke-dasharray:1.5 5}

.pill{position:absolute;transform:translate(-50%,-50%);background:var(--card);border:1.5px solid;border-radius:999px;
  padding:.32cqw .8cqw .28cqw;text-align:center;white-space:nowrap;line-height:1.25;z-index:3;transition:opacity .25s;pointer-events:none}
.pill b{display:block;font-family:var(--zh);font-weight:700;font-size:1.05cqw}
.pill small{display:block;font-size:1cqw;color:var(--ink2)}
.pill.shisheng{border-color:var(--t-shisheng);color:var(--t-shisheng)}
.pill.tongxue{border-color:var(--t-tongxue);color:var(--t-tongxue)}
.pill.pengyou{border-color:var(--t-pengyou);color:var(--t-pengyou)}
.pill.jiaren{border-color:var(--t-jiaren);color:var(--t-jiaren)}
.pill.tongshi{border-color:var(--t-tongshi);color:var(--t-tongshi)}
.pill.lianren{border-color:var(--t-lianren);color:var(--t-lianren)}
.pill.haogan{border-color:var(--t-lianren);border-style:dotted;color:var(--t-lianren)}
.tag{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:.92cqw;z-index:2;transition:opacity .25s;pointer-events:none;line-height:1.2}
.tag b{font-family:var(--zh);font-size:1.05cqw;margin-right:.3em}
.tag.tongxue{color:var(--t-tongxue)} .tag.jiaren{color:var(--t-jiaren)}
.stage.P .tag{font-size:2.4cqw} .stage.P .tag b{font-size:2.8cqw}
.no-vi .tag .vi{visibility:hidden} .no-py .tag .py{display:none}
.stage.focus .tag:not(.on){opacity:.12}

.node{position:absolute;width:var(--cw);transform:translate(-50%,calc(-1 * (var(--pt) + var(--av) / 2)));
  background:var(--card);border:1.5px solid var(--line);border-radius:1.1cqw;padding:var(--pt) .4cqw .55cqw;text-align:center;z-index:4;
  box-shadow:0 .25cqw .8cqw rgba(31,45,49,.10);transition:opacity .25s,transform .2s,border-color .2s,box-shadow .2s}
.node:hover{border-color:var(--main)}
.node .av{width:var(--av);height:var(--av);border-radius:50%;margin:0 auto;overflow:hidden;border:.25cqw solid var(--main-soft);background:#eee}
.node .av img{width:100%;height:100%;object-fit:cover;transform:scale(1.07);display:block}
.node .zh{font-family:var(--zh);font-weight:700;font-size:var(--fz);margin-top:.35cqw;line-height:1.2}
.node .py{font-style:italic;font-size:var(--fp);color:var(--main);line-height:1.25}
.node .tg{font-size:var(--ft);color:var(--ink2);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node.sel{border-color:var(--main);box-shadow:0 0 0 .35cqw rgba(63,102,112,.28),0 .4cqw 1.2cqw rgba(31,45,49,.18)}
.node.ai .av{border-color:#D9D2EE}

.stage.L{--cw:11.5cqw;--av:6.2cqw;--pt:.55cqw;--fz:1.6cqw;--fp:1.02cqw;--ft:.88cqw}
.stage.P{--cw:27cqw;--av:15cqw;--pt:1.4cqw;--fz:4.4cqw;--fp:3cqw;--ft:2.6cqw}
.stage.P .zone h2{font-size:3.2cqw;left:2.5cqw;top:1.2cqw}
.stage.P .zone{border-radius:3cqw}
.stage.P .band{border-radius:3cqw}
.stage.P .pill{padding:.6cqw 1.6cqw .45cqw;line-height:1.25}
.stage.P .pill b{font-size:2.7cqw}
.stage.P .pill small{font-size:2.35cqw}
.stage.P .node{border-radius:2.6cqw}

.no-py .node .py,.no-py .pill small.py{visibility:hidden}
.no-vi .node .tg,.no-vi .pill small.vi{visibility:hidden}

/* focus mode */
.stage.focus .node:not(.rel){opacity:.22}
.stage.focus .seg:not(.on),.stage.focus .pill:not(.on),.stage.focus .band:not(.on){opacity:.12}
.stage.focus .seg.on{stroke-width:3.4}

/* legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;padding:8px 10px 4px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:22px;height:0;border-top:3px solid}
.legend i.d{border-top-style:dashed}
.hint{font-size:12.5px;color:var(--ink2);text-align:center;opacity:.85;padding-bottom:4px}

footer{display:flex;justify-content:center;align-items:center;gap:10px;padding:6px 16px 10px;font-size:12.5px;color:var(--ink2);position:relative}
.stamp{position:fixed;right:14px;bottom:10px;border:2px solid var(--seal);color:var(--seal);opacity:.16;font-weight:700;font-size:12px;
  padding:3px 8px;border-radius:4px;transform:rotate(-8deg);pointer-events:none;letter-spacing:.5px}

/* ---------- detail drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(31,45,49,.30);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:21;background:var(--card);box-shadow:0 10px 40px rgba(31,45,49,.25);transition:transform .3s ease;overflow:auto;
  top:12px;right:12px;bottom:12px;width:min(400px,calc(100vw - 24px));border-radius:16px;border:1.5px solid var(--line);transform:translateX(calc(100% + 30px))}
.drawer.open{transform:none}
.dhead{display:flex;gap:14px;align-items:center;padding:18px 18px 12px;border-bottom:1px dashed var(--line);position:sticky;top:0;background:var(--card);z-index:5}
.dhead .av{width:84px;height:84px;border-radius:50%;overflow:hidden;border:3px solid var(--main-soft);flex:none}
.dhead .av img{width:100%;height:100%;object-fit:cover;transform:scale(1.07)}
.dhead .zh{font-family:var(--zh);font-size:30px;font-weight:700;line-height:1.1}
.dhead .py{font-style:italic;color:var(--main);font-size:16px}
.dhead .vn{font-size:14px;color:var(--ink2)}
.close{position:absolute;top:10px;right:10px;z-index:6;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);font-size:18px;line-height:1;background:var(--card)}
.dbody{padding:14px 18px 20px}
.dbody h3{font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--main);margin:14px 0 8px}
.dbody h3:first-child{margin-top:0}
.book{font-family:var(--zh);font-size:16px;line-height:1.7;background:var(--bg);border-left:3px solid var(--main);padding:8px 12px;border-radius:0 8px 8px 0}
.desc{font-size:14.5px;line-height:1.6;margin-top:8px}
.rel-row{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff;cursor:pointer;width:100%;text-align:left}
.rel-row:hover{border-color:var(--main)}
.rel-row .mini{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none}
.rel-row .mini img{width:100%;height:100%;object-fit:cover;transform:scale(1.07)}
.rel-row .who{font-family:var(--zh);font-weight:700;font-size:17px}
.rel-row .who em{font-family:var(--vi);font-style:normal;font-weight:400;font-size:13px;color:var(--ink2)}
.rel-row .term{display:inline-block;margin-top:2px;font-size:13.5px;padding:1px 8px;border-radius:999px;color:#fff}
.rel-row .term b{font-family:var(--zh)}
.rel-row .sen{font-family:var(--zh);font-size:15px;margin-top:6px}
.rel-row .senpy{font-size:12.5px;font-style:italic;color:var(--ink2)}
.term.shisheng{background:var(--t-shisheng)} .term.tongxue{background:var(--t-tongxue)} .term.pengyou{background:var(--t-pengyou)}
.term.jiaren{background:var(--t-jiaren)} .term.tongshi{background:var(--t-tongshi)}
.term.lianren,.term.haogan{background:var(--t-lianren)}
.rel-row .from{display:inline-block;margin-left:6px;font-size:11.5px;padding:0 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);vertical-align:1px}
.rel-row .from.new{border-color:var(--main);color:var(--main);font-weight:600}
.prev{font-size:13px;line-height:1.55;color:var(--ink2);margin-top:8px;padding:6px 10px;border:1px dashed var(--line);border-radius:8px}
.prev b{font-family:var(--zh);font-weight:400}
.legend .hide{display:none}

@media (max-width:720px), (max-aspect-ratio:1/1){
  header{padding:10px 14px 4px}
  .title{order:3;width:100%;flex-basis:100%}
  .title h1{font-size:21px}
  .tools{margin-left:auto}
  main{padding:0 10px}
  .drawer{top:auto;left:0;right:0;bottom:0;width:100%;max-height:82svh;border-radius:18px 18px 0 0;transform:translateY(100%)}
  .drawer.open{transform:none}
  .legend{font-size:12px;gap:10px}
  .levels{flex-wrap:nowrap;gap:5px;padding:2px 10px 8px}
  .lv{padding:5px 10px;white-space:nowrap}
  .lv small{display:none}
}
</style>
</head>

const LEVELS=[{n:1,ok:true},{n:2,ok:true},{n:3,ok:true},{n:4,ok:true},{n:5}];
/* Mặc định mở HSK 1; mở thẳng cấp khác bằng đường link ?lv=2, ?lv=3... */
const maxLv=Math.max(...LEVELS.filter(l=>l.ok).map(l=>l.n));
const askLv=parseInt(new URLSearchParams(location.search).get('lv'),10);
let curLv=LEVELS.some(l=>l.ok&&l.n===askLv)?askLv:1, mode='L', selected=null;
const stage=document.getElementById('stage'), lvBox=document.getElementById('levels');
LEVELS.forEach(l=>{
  const b=document.createElement('button');
  b.className='lv'+(l.n===curLv?' on':''); b.disabled=!l.ok; b.dataset.lv=l.n;
  b.innerHTML=l.ok?`HSK ${l.n}`:`HSK ${l.n} <small>· sắp cập nhật</small>`;
  b.onclick=()=>{if(!l.ok||l.n===curLv)return;curLv=l.n;
    lvBox.querySelectorAll('.lv').forEach(x=>x.classList.toggle('on',+x.dataset.lv===curLv));
    closeDrawer();render();};
  lvBox.appendChild(b);
});
const vis=x=>(x.lv||1)<=curLv&&(!x.to||curLv<=x.to);  /* to: cấp cuối cùng còn vẽ trên sơ đồ */
function posOf(lay){let p={...lay.pos};Object.keys(lay.posLv||{}).map(Number).sort((a,b)=>a-b)
  .forEach(k=>{if(k<=curLv)p={...p,...lay.posLv[k]};});return p;}

const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
function pt(p,lay){const q=typeof p==='string'?lay.P[p]:p;return [q[0],q[1]*lay.s];}
const topPct=(y,lay)=>(y*lay.s/lay.h*100)+'%';

function render(){
  const lay={...LAYOUT[mode]}; lay.P=posOf(lay);
  stage.className='stage '+mode; stage.innerHTML='';
  document.querySelectorAll('.legend [data-lv]').forEach(e=>e.classList.toggle('hide',!!(+e.dataset.lv>curLv||(e.dataset.to&&curLv>+e.dataset.to))));
  lay.zones.forEach(z0=>{let z=z0;Object.keys(z0.lvs||{}).map(Number).sort((a,b)=>a-b).forEach(k=>{if(k<=curLv)z={...z,...z0.lvs[k]};});
    if(z.hide) return;
    if(z.big){const B=lay.zones[lay.zones.length-1].r;z={...z,r:mode==='L'?[z.r[0],z.r[1],B[0]+B[2]-z.r[0],z.r[3]]:[z.r[0],z.r[1],z.r[2],B[1]+B[3]-z.r[1]]};}
    const d=el('div','zone '+z.c,`<h2>${z.zh} <i>· ${z.vi}</i></h2>`);
    Object.assign(d.style,{left:z.r[0]+'%',top:topPct(z.r[1],lay),width:z.r[2]+'%',height:(z.r[3]*lay.s/lay.h*100)+'%'});stage.appendChild(d);});
  stage.appendChild(el('div','crane'));
  lay.bands.filter(vis).forEach(b=>{const d=el('div','band '+b.t);d.dataset.n=b.n.join(' ');
    Object.assign(d.style,{left:b.r[0]+'%',top:topPct(b.r[1],lay),width:b.r[2]+'%',height:(b.r[3]*lay.s/lay.h*100)+'%'});stage.appendChild(d);});
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 100 ${lay.h}`);svg.setAttribute('preserveAspectRatio','none');
  lay.segs.filter(vis).forEach(s=>{const p=document.createElementNS(svg.namespaceURI,'polyline');
    p.setAttribute('points',s.p.map(x=>pt(x,lay).join(',')).join(' '));
    p.setAttribute('class','seg '+s.t+(s.d===2?' dot':s.d?' dash':''));p.dataset.n=s.n.join(' ');svg.appendChild(p);});
  stage.appendChild(svg);
  lay.pills.filter(vis).forEach(p=>{const d=el('div','pill '+p.t,`<b>${p.zh}</b><small class="py">${p.py}</small><small class="vi">${p.vi}</small>`);
    d.dataset.n=p.n.join(' ');d.style.left=p.at[0]+'%';d.style.top=topPct(p.at[1],lay);stage.appendChild(d);});
  (lay.tags||[]).filter(vis).forEach(p=>{const d=el('div','tag '+p.t,`<b>${p.zh}</b>${p.py?`<span class="py">${p.py} · </span>`:''}<span class="vi">${p.vi}</span>`);
    d.dataset.n=p.n.join(' ');d.style.left=p.at[0]+'%';d.style.top=topPct(p.at[1],lay);stage.appendChild(d);});
  Object.entries(C).filter(([,c])=>c.lv<=curLv).forEach(([id,c])=>{
    const q=lay.P[id]; if(!q) return; const f=info(id,curLv);
    const b=el('button','node'+(c.cls?' '+c.cls:''),
      `<div class="av"><img src="${AV[id]}" alt=""></div><div class="zh">${c.zh}</div><div class="py">${c.py}</div><div class="tg">${f.tag}</div>`);
    b.dataset.id=id; b.style.left=q[0]+'%'; b.style.top=topPct(q[1],lay);
    b.setAttribute('aria-label',`${c.zh} ${c.vn}`);
    b.onclick=()=>select(id); stage.appendChild(b);
  });
  if(selected) highlight(selected);
}

function relsOf(id){
  return R.filter(r=>r.lv<=curLv&&(r.a===id||r.b===id)).map(r=>({...(r.a===id?{o:r.b,term:r.ab}:{o:r.a,term:r.ba}),t:r.t,lv:r.lv,mutual:r.mutual}));
}
function highlight(id){
  const rel=new Set([id,...relsOf(id).map(x=>x.o)]);
  stage.classList.add('focus');
  stage.querySelectorAll('.node').forEach(n=>{n.classList.toggle('rel',rel.has(n.dataset.id));n.classList.toggle('sel',n.dataset.id===id);});
  stage.querySelectorAll('[data-n]').forEach(e=>e.classList.toggle('on',e.dataset.n.split(' ').includes(id)));
}
function clearFocus(){
  selected=null;stage.classList.remove('focus');
  stage.querySelectorAll('.sel,.rel,.on').forEach(e=>e.classList.remove('sel','rel','on'));
}

const drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim');
function select(id){
  selected=id; highlight(id);
  const c=C[id], f=info(id,curLv), rs=relsOf(id).sort((x,y)=>y.lv-x.lv);
  const rows=rs.map(r=>{const o=C[r.o];
    const sen=r.mutual?`${c.zh}和${o.zh}${r.term.zh}。`:`${o.zh}是${c.zh}的${r.term.zh}。`;
    const spy=r.mutual?`${c.py} hé ${o.py} ${r.term.py}.`:`${o.py} shì ${c.py} de ${r.term.py}.`;
    return `<button class="rel-row" data-go="${r.o}">
      <div class="mini"><img src="${AV[r.o]}" alt=""></div>
      <div><div class="who">${o.zh} <em>${o.py} · ${o.vn}</em></div>
      <span class="term ${r.t}"><b>${r.term.zh}</b> ${r.term.py} · ${r.term.vn}</span><span class="from${r.lv>1&&r.lv===curLv?' new':''}">từ HSK ${r.lv}</span>
      <div class="sen">${sen}</div>
      <div class="senpy">${spy}</div></div></button>`;}).join('');
  const old=f.lv>c.lv?info(id,f.lv-1):null;
  const prev=old&&old.book!==f.book?`<div class="prev">Ở HSK ${old.lv}: <b>${old.book}</b></div>`:'';
  drawer.innerHTML=`<button class="close" aria-label="Đóng">✕</button>
    <div class="dhead"><div class="av"><img src="${AV[id]}" alt=""></div>
      <div><div class="zh">${c.zh}</div><div class="py">${c.py}</div><div class="vn">${c.vn} · ${f.tag}</div></div></div>
    <div class="dbody"><h3>Giới thiệu trong sách · HSK ${curLv}</h3><div class="book">${f.book}</div><p class="desc">${f.desc}</p>${prev}
    ${rows?`<h3>Mối quan hệ (${rs.length})</h3>${rows}`:''}</div>`;
  drawer.querySelector('.close').onclick=closeDrawer;
  drawer.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>select(b.dataset.go));
  drawer.classList.add('open');drawer.setAttribute('aria-hidden','false');scrim.classList.add('open');drawer.scrollTop=0;
}
function closeDrawer(){drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');scrim.classList.remove('open');clearFocus();}
scrim.onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});

function toggle(btn,cls){btn.onclick=()=>{const on=btn.getAttribute('aria-pressed')!=='true';btn.setAttribute('aria-pressed',on);document.body.classList.toggle(cls,!on);};}
toggle(document.getElementById('tPy'),'no-py');toggle(document.getElementById('tVi'),'no-vi');

const mq=window.matchMedia('(max-width:720px), (max-aspect-ratio:1/1)');
function pick(){const m=mq.matches?'P':'L';if(m!==mode||!stage.children.length){mode=m;render();}}
mq.addEventListener?mq.addEventListener('change',pick):mq.addListener(pick);
pick();
</script>
</body>
</html>
